apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rca-agent-role
  namespace: test-ns
rules:
- apiGroups: ["", "apps", "batch"]
  resources:
    - pods
    - pods/log
    - pods/status
    - events
    - services
    - endpoints
    - configmaps
    - deployments
    - statefulsets
    - daemonsets
    - replicasets
  verbs: ["get", "list", "watch"]
